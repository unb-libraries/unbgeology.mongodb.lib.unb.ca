services:
  unbgeology.mongodb.lib.unb.ca:
    build:
      context: .
    env_file:
      - ./env/mongodb.env
    restart: unless-stopped
    container_name: unbgeology.mongodb.lib.unb.ca
    expose:
      - "27017"
    volumes:
      - mongodb-data:/var/lib/mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
volumes:
  mongodb-data:
